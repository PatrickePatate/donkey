# Production stack:
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build
# TLS is expected to be terminated in front of the `web` service (Caddy, Traefik, a load balancer...).

x-app: &app
  build:
    context: .
    target: app
  image: donkey-app:latest
  restart: unless-stopped
  env_file: .env.production
  environment:
    DB_HOST: pgsql
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - storage:/var/www/html/storage
    - ${GITHUB_APP_PRIVATE_KEY_FILE:-./github-app.pem}:/var/www/html/storage/app/private/github-app.pem:ro
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_started
    migrate:
      condition: service_completed_successfully

services:
  web:
    build:
      context: .
      target: web
    image: donkey-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app
      - reverb

  app:
    <<: *app

  horizon:
    <<: *app
    command: php artisan horizon
    stop_grace_period: 60s

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  scheduler:
    <<: *app
    command: php artisan schedule:work

  migrate:
    build:
      context: .
      target: app
    image: donkey-app:latest
    env_file: .env.production
    environment:
      DB_HOST: pgsql
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage:/var/www/html/storage
    command: php artisan migrate --force
    restart: "no"
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-donkey}
      POSTGRES_USER: ${DB_USERNAME:-donkey}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  storage:
  pgsql-data:
  redis-data:
