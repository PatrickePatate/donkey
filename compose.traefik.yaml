# Override for hosts where Traefik already owns ports 80/443 (external `web` network, Let's Encrypt resolver `lets-encrypt`).
#   docker compose --env-file .env.production -f compose.prod.yaml -f compose.traefik.yaml up -d --build
# Set DONKEY_HOST in .env.production (e.g. donkey.example.com).

services:
  web:
    ports: !reset []
    networks: [default, web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.donkey.rule=Host(`${DONKEY_HOST:?Set DONKEY_HOST in .env.production}`)
      - traefik.http.routers.donkey.entrypoints=websecure
      - traefik.http.routers.donkey.tls=true
      - traefik.http.routers.donkey.tls.certresolver=lets-encrypt
      - traefik.http.services.donkey.loadbalancer.server.port=80

networks:
  web:
    external: true
